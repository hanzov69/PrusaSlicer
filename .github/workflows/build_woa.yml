name: Build WoA (PoC)

on:
  workflow_dispatch:
    inputs:
      reset_cache:
        description: 'Skip restoring deps cache'
        default: false
        type: boolean
      excludes:
        description: 'Regex of deps to exclude'
        default: 'OpenEXR|OpenVDB|GMP|MPFR'
        type: string
      upstream_ref:
        description: 'Upstream ref/SHA to check out (blank = current branch tip)'
        default: ''
        type: string
  push:
    branches: [woa-poc]
    paths:
      - '.github/workflows/build_woa.yml'
      - 'deps/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'src/**/CMakeLists.txt'

concurrency:
  group: woa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 350
    env:
      DEPS_DESTDIR: ${{ github.workspace }}\deps-destdir
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: ARM64
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      EXCLUDES: ${{ inputs.excludes || 'OpenEXR|OpenVDB|GMP|MPFR' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.upstream_ref || github.ref }}
          fetch-depth: 1

      - name: Install CMake 3.31 (ARM64)
        shell: pwsh
        run: |
          # CMake 4.x fails on Boost.Context's enable_language(ASM_ARMASM) because
          # it requires CMakeASM_ARMASMLinkerInformation.cmake which CMake 4 does
          # not ship (linker introspection regression for old languages). Pin to
          # 3.31 which doesn't enforce this and works fine with Boost 1.85.
          $url = "https://github.com/Kitware/CMake/releases/download/v3.31.12/cmake-3.31.12-windows-arm64.zip"
          $zip = "$env:RUNNER_TEMP\cmake.zip"
          $dst = "$env:RUNNER_TEMP\cmake"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $bin = (Get-ChildItem -Recurse -Filter cmake.exe $dst | Select-Object -First 1).DirectoryName
          Write-Host "Pinned cmake: $bin"
          # Prepend to PATH for subsequent steps
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\cmake.exe" --version

      - name: Runner probe
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "CMAKE_GENERATOR=$env:CMAKE_GENERATOR"
          Write-Host "CMAKE_GENERATOR_PLATFORM=$env:CMAKE_GENERATOR_PLATFORM"
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" }
          $vsroot = & $vswhere -nologo -latest -property installationPath
          Write-Host "VS root: $vsroot"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,@{n='Free(GB)';e={[math]::Round($_.Free/1GB,1)}}

      - name: Restore deps cache
        id: deps-cache-restore
        if: ${{ !inputs.reset_cache }}
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-destdir
            deps/build
          key: woa-deps-v5-${{ hashFiles('deps/**/*.cmake', 'deps/CMakeLists.txt', 'cmake/modules/AddCMakeProject.cmake') }}
          restore-keys: |
            woa-deps-v5-

      - name: Scrub stale dep state from cache
        if: ${{ !inputs.reset_cache }}
        shell: pwsh
        run: |
          # When a dep's URL or source layout changes (e.g. Boost version bump,
          # GLEW fork swap), CMake's per-build CMakeCache.txt records the old
          # source path and refuses to reconfigure. Force-clean those subtrees
          # so ExternalProject re-fetches and re-configures from scratch.
          # Empty unless a dep's source layout/URL just changed and its build dir
          # holds a stale CMakeCache that would refuse to reconfigure.
          $scrub = @()
          foreach ($d in $scrub) {
            foreach ($p in @("deps/build/dep_${d}-prefix", "deps/build/builds/$d", "deps/build/dep_${d}.dir")) {
              if (Test-Path $p) {
                Write-Host "Removing $p"
                Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue
              }
            }
          }
          # Also clear the parent CMakeCache so it reflects new dep configs.
          if (Test-Path 'deps/build/CMakeCache.txt') {
            Write-Host "Removing deps/build/CMakeCache.txt"
            Remove-Item -Force 'deps/build/CMakeCache.txt' -ErrorAction SilentlyContinue
          }

      - name: Configure deps
        shell: cmd
        run: |
          @echo on
          REM Set up MSVC ARM64 native dev environment
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          if not exist "%VSROOT%" for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\Common7\Tools\vsdevcmd.bat" -arch=arm64 -host_arch=arm64 -app_platform=Desktop || exit /b 1

          if not exist deps\build mkdir deps\build
          cd deps\build
          cmake.exe .. -G "Visual Studio 17 2022" -A ARM64 ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DDESTDIR="%DEPS_DESTDIR%" ^
            -DDEP_DEBUG=OFF ^
            "-DPrusaSlicer_deps_PACKAGE_EXCLUDES=%EXCLUDES%"
          if errorlevel 1 (echo Configure failed & exit /b 1)
          echo Configured successfully.
          type CMakeCache.txt | findstr /R "PrusaSlicer_deps_PACKAGE_EXCLUDES CMAKE_GENERATOR_PLATFORM CMAKE_VS_PLATFORM_NAME"

      - name: Build deps
        id: build-deps
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          if not exist "%VSROOT%" for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\Common7\Tools\vsdevcmd.bat" -arch=arm64 -host_arch=arm64 -app_platform=Desktop || exit /b 1

          cd deps\build
          REM Use normal verbosity so cmake stdout from ExternalProject configure surfaces.
          msbuild /m:4 /p:Configuration=RelWithDebInfo /p:Platform=ARM64 /v:normal /nologo ALL_BUILD.vcxproj
          set BUILD_RC=%ERRORLEVEL%
          echo MSBUILD-RC=%BUILD_RC%
          REM Parens so the digit before >> is not parsed as a stdin-redirect FD.
          (echo build_rc=%BUILD_RC%)>> "%GITHUB_OUTPUT%"
          REM Always exit 0 here so artifact upload happens; the next step will set final status.
          exit /b 0

      - name: Inventory deps progress
        if: always()
        shell: pwsh
        run: |
          $stampDir = "deps/build"
          if (Test-Path $stampDir) {
            Write-Host "=== Per-dep stamp file presence ==="
            $deps = @('Blosc','Boost','Catch2','Cereal','CURL','Eigen','EXPAT','GLEW','GMP','heatshrink','JPEG','json','LibBGCode','MPFR','NanoSVG','NLopt','OCCT','OpenCSG','OpenEXR','OpenSSL','OpenVDB','PNG','Qhull','TBB','wxWidgets','z3','ZLIB','CGAL')
            foreach ($d in $deps) {
              $stampPath = "deps/build/dep_${d}-prefix/src/dep_${d}-stamp"
              if (Test-Path $stampPath) {
                # Multi-config (Visual Studio) places stamps under <Config>/ subdir.
                $files = Get-ChildItem $stampPath -Recurse -File -ErrorAction SilentlyContinue
                $hasInstall = ($files | Where-Object { $_.Name -like '*-install' }).Count -gt 0
                $hasBuild   = ($files | Where-Object { $_.Name -like '*-build' }).Count -gt 0
                $hasConfig  = ($files | Where-Object { $_.Name -like '*-configure' }).Count -gt 0
                $status = if ($hasInstall) { 'INSTALLED' } elseif ($hasBuild) { 'BUILT' } elseif ($hasConfig) { 'CONFIGURED' } else { 'STARTED' }
                Write-Host ("  [{0,-10}] {1}" -f $status, $d)
              } else {
                # GMP / MPFR are custom_target, no -prefix dir — check destdir
                if ($d -in @('GMP','MPFR') -and (Test-Path "$env:DEPS_DESTDIR/usr/local/include")) {
                  Write-Host ("  [{0,-10}] {1}" -f 'COPIED?', $d)
                } else {
                  Write-Host ("  [{0,-10}] {1}" -f 'SKIPPED', $d)
                }
              }
            }
          } else {
            Write-Host "deps/build does not exist"
          }

      - name: Set job result based on msbuild
        if: always()
        shell: pwsh
        run: |
          $rc = "${{ steps.build-deps.outputs.build_rc }}"
          if ($rc -ne "0") {
            Write-Host "msbuild returned $rc — deps build failed."
            exit 1
          }
          Write-Host "msbuild returned 0 — deps build succeeded."

      - name: Save deps cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: |
            deps-destdir
            deps/build
          key: woa-deps-v5-${{ hashFiles('deps/**/*.cmake', 'deps/CMakeLists.txt', 'cmake/modules/AddCMakeProject.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null
          $patterns = @(
            'deps/build/CMakeCache.txt',
            'deps/build/CMakeFiles/CMakeOutput.log',
            'deps/build/CMakeFiles/CMakeError.log',
            'deps/build/dep_*-prefix/src/dep_*-stamp/*.log',
            'deps/build/builds/*/CMakeCache.txt',
            'deps/build/builds/*/CMakeFiles/CMakeError.log',
            'deps/build/builds/*/CMakeFiles/CMakeOutput.log'
          )
          foreach ($p in $patterns) {
            Get-ChildItem -Path $p -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              $rel = (Resolve-Path -Relative $_.FullName) -replace '^\.[\\/]',''
              $dest = Join-Path 'artifacts/logs' ($rel -replace '[\\/:]','_')
              Copy-Item $_.FullName $dest -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Collected $((Get-ChildItem artifacts/logs).Count) log files."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-logs-${{ github.run_attempt }}
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload deps destdir (success only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deps-destdir-arm64
          path: deps-destdir
          retention-days: 7
          compression-level: 1

      # ------------------------------------------------------------------
      # App build (PrusaSlicer itself), reusing the deps we just built.
      # ------------------------------------------------------------------

      - name: Mirror wxWidgets headers (idempotent)
        if: success()
        shell: pwsh
        run: |
          # Belt-and-suspenders for the wxWidgets POST_BUILD copy: if the wx
          # install came from a prior cache without the mirrored layout, do it
          # here so PrusaSlicer's FindwxWidgets module can locate include/wx/wx.h.
          $src = "$env:DEPS_DESTDIR\usr\local\include\wx-3.2"
          $dst = "$env:DEPS_DESTDIR\usr\local\include"
          if ((Test-Path $src) -and (-not (Test-Path "$dst\wx\wx.h"))) {
            Copy-Item -Recurse -Force "$src\*" $dst
            Write-Host "Mirrored wx-3.2/* -> include/"
          } else {
            Write-Host "No mirror needed (already present or wx-3.2 missing)"
          }

      - name: Restore app-build cache
        if: success()
        id: app-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: build-app
          key: woa-app-v2-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'src/libslic3r/CMakeLists.txt', 'cmake/modules/**') }}
          restore-keys: |
            woa-app-v2-

      - name: Configure app
        if: success()
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          if not exist "%VSROOT%" for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\Common7\Tools\vsdevcmd.bat" -arch=arm64 -host_arch=arm64 -app_platform=Desktop || exit /b 1

          if not exist build-app mkdir build-app
          cmake.exe -S . -B build-app -G "Visual Studio 17 2022" -A ARM64 ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_PREFIX_PATH="%DEPS_DESTDIR%\usr\local" ^
            -DCGAL_DISABLE_GMP=ON ^
            -DSLIC3R_PCH=OFF ^
            -DSLIC3R_BUILD_TESTS=OFF ^
            -DSLIC3R_GUI=1
          if errorlevel 1 (echo App configure failed & exit /b 1)
          echo App configured successfully.

      - name: Build app
        id: build-app
        if: success()
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          if not exist "%VSROOT%" for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\Common7\Tools\vsdevcmd.bat" -arch=arm64 -host_arch=arm64 -app_platform=Desktop || exit /b 1

          cd build-app
          msbuild /m:4 /p:Configuration=RelWithDebInfo /p:Platform=ARM64 /v:normal /nologo PrusaSlicer.sln
          set APP_RC=%ERRORLEVEL%
          echo APP-MSBUILD-RC=%APP_RC%
          (echo build_rc=%APP_RC%)>> "%GITHUB_OUTPUT%"
          exit /b 0

      - name: Save app-build cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: build-app
          key: woa-app-v2-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'src/libslic3r/CMakeLists.txt', 'cmake/modules/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect app build logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/app-logs | Out-Null
          $patterns = @(
            'build-app/CMakeCache.txt',
            'build-app/CMakeFiles/CMakeError.log',
            'build-app/CMakeFiles/CMakeOutput.log'
          )
          foreach ($p in $patterns) {
            Get-ChildItem -Path $p -ErrorAction SilentlyContinue | ForEach-Object {
              $rel = (Resolve-Path -Relative $_.FullName) -replace '^\.[\\/]',''
              $dest = Join-Path 'artifacts/app-logs' ($rel -replace '[\\/:]','_')
              Copy-Item $_.FullName $dest -ErrorAction SilentlyContinue
            }
          }

      - name: Upload app build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs-${{ github.run_attempt }}
          path: artifacts/app-logs
          if-no-files-found: warn

      - name: Upload PrusaSlicer ARM64 binaries
        if: success() && steps.build-app.outputs.build_rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: prusaslicer-woa-arm64
          path: |
            build-app/src/RelWithDebInfo/*.exe
            build-app/src/RelWithDebInfo/*.dll
            build-app/src/RelWithDebInfo/*.pdb
          if-no-files-found: warn
          retention-days: 14

      - name: Final result
        if: always()
        shell: pwsh
        run: |
          $rc = "${{ steps.build-app.outputs.build_rc }}"
          if (-not $rc) { Write-Host "App build did not run."; exit 0 }
          if ($rc -ne "0") {
            Write-Host "App msbuild returned $rc — app build failed."
            exit 1
          }
          Write-Host "App msbuild returned 0 — app build succeeded."
