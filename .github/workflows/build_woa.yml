name: Build WoA (PoC)

on:
  workflow_dispatch:
    inputs:
      reset_cache:
        description: 'Skip restoring deps cache'
        default: false
        type: boolean
      excludes:
        description: 'Regex of deps to exclude'
        default: 'OpenEXR|OpenVDB|CGAL'
        type: string
      upstream_ref:
        description: 'Upstream ref/SHA to check out (blank = current branch tip)'
        default: ''
        type: string
  push:
    branches: [woa-poc]
    paths:
      - '.github/workflows/build_woa.yml'
      - 'deps/**'
      - 'cmake/**'

concurrency:
  group: woa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 350
    env:
      DEPS_DESTDIR: ${{ github.workspace }}\deps-destdir
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: ARM64
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      EXCLUDES: ${{ inputs.excludes || 'OpenEXR|OpenVDB|CGAL' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.upstream_ref || github.ref }}
          fetch-depth: 1

      - name: Runner probe
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "CMAKE_GENERATOR=$env:CMAKE_GENERATOR"
          Write-Host "CMAKE_GENERATOR_PLATFORM=$env:CMAKE_GENERATOR_PLATFORM"
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" }
          $vsroot = & $vswhere -nologo -latest -property installationPath
          Write-Host "VS root: $vsroot"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,@{n='Free(GB)';e={[math]::Round($_.Free/1GB,1)}}

      - name: Restore deps cache
        id: deps-cache-restore
        if: ${{ !inputs.reset_cache }}
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-destdir
            deps/build
          key: woa-deps-v5-${{ hashFiles('deps/**/*.cmake', 'deps/CMakeLists.txt', 'cmake/modules/AddCMakeProject.cmake') }}
          restore-keys: |
            woa-deps-v5-

      - name: Configure deps
        shell: cmd
        run: |
          @echo on
          REM Set up MSVC ARM64 native dev environment
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          if not exist "%VSROOT%" for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\Common7\Tools\vsdevcmd.bat" -arch=arm64 -host_arch=arm64 -app_platform=Desktop || exit /b 1

          if not exist deps\build mkdir deps\build
          cd deps\build
          cmake.exe .. -G "Visual Studio 17 2022" -A ARM64 ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DDESTDIR="%DEPS_DESTDIR%" ^
            -DDEP_DEBUG=OFF ^
            "-DPrusaSlicer_deps_PACKAGE_EXCLUDES=%EXCLUDES%"
          if errorlevel 1 (echo Configure failed & exit /b 1)
          echo Configured successfully.
          type CMakeCache.txt | findstr /R "PrusaSlicer_deps_PACKAGE_EXCLUDES CMAKE_GENERATOR_PLATFORM CMAKE_VS_PLATFORM_NAME"

      - name: Build deps
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          if not exist "%VSROOT%" for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\Common7\Tools\vsdevcmd.bat" -arch=arm64 -host_arch=arm64 -app_platform=Desktop || exit /b 1

          cd deps\build
          REM Use normal verbosity so cmake stdout from ExternalProject configure surfaces.
          msbuild /m:4 /p:Configuration=RelWithDebInfo /p:Platform=ARM64 /v:normal /nologo ALL_BUILD.vcxproj
          set BUILD_RC=%ERRORLEVEL%
          echo MSBUILD-RC=%BUILD_RC%
          REM Always exit 0 here so artifact upload happens; the next step will set final status.
          exit /b 0

      - name: Inventory deps progress
        if: always()
        shell: pwsh
        run: |
          $stampDir = "deps/build"
          if (Test-Path $stampDir) {
            Write-Host "=== Per-dep stamp file presence ==="
            $deps = @('Blosc','Boost','Catch2','Cereal','CURL','Eigen','EXPAT','GLEW','GMP','heatshrink','JPEG','json','LibBGCode','MPFR','NanoSVG','NLopt','OCCT','OpenCSG','OpenEXR','OpenSSL','OpenVDB','PNG','Qhull','TBB','wxWidgets','z3','ZLIB','CGAL')
            foreach ($d in $deps) {
              $stampPath = "deps/build/dep_${d}-prefix/src/dep_${d}-stamp"
              if (Test-Path $stampPath) {
                $files = Get-ChildItem $stampPath -ErrorAction SilentlyContinue | Sort-Object Name
                $names = $files | ForEach-Object { $_.Name }
                $hasInstall = ($files | Where-Object { $_.Name -like '*-install' }).Count -gt 0
                $hasBuild   = ($files | Where-Object { $_.Name -like '*-build' }).Count -gt 0
                $hasConfig  = ($files | Where-Object { $_.Name -like '*-configure' }).Count -gt 0
                $status = if ($hasInstall) { 'INSTALLED' } elseif ($hasBuild) { 'BUILT' } elseif ($hasConfig) { 'CONFIGURED' } else { 'STARTED' }
                Write-Host ("  [{0,-10}] {1}" -f $status, $d)
              } else {
                # GMP / MPFR are custom_target, no -prefix dir — check destdir
                if ($d -in @('GMP','MPFR') -and (Test-Path "$env:DEPS_DESTDIR/usr/local/include")) {
                  Write-Host ("  [{0,-10}] {1}" -f 'COPIED?', $d)
                } else {
                  Write-Host ("  [{0,-10}] {1}" -f 'SKIPPED', $d)
                }
              }
            }
          } else {
            Write-Host "deps/build does not exist"
          }

      - name: Set job result based on msbuild
        if: always()
        shell: pwsh
        run: |
          # Re-evaluate by checking that all NON-EXCLUDED deps installed.
          $excludeRegex = "$env:EXCLUDES"
          $required = @('Blosc','Boost','Catch2','Cereal','CURL','Eigen','EXPAT','GLEW','GMP','heatshrink','JPEG','json','LibBGCode','MPFR','NanoSVG','NLopt','OCCT','OpenCSG','OpenSSL','PNG','Qhull','TBB','wxWidgets','z3','ZLIB','CGAL','OpenEXR','OpenVDB')
          $required = $required | Where-Object { $_ -notmatch $excludeRegex }
          $missing = @()
          foreach ($d in $required) {
            $stampPath = "deps/build/dep_${d}-prefix/src/dep_${d}-stamp"
            $installed = Test-Path "$stampPath/dep_${d}-install"
            $copied = (Test-Path "$env:DEPS_DESTDIR/usr/local/include/gmp.h") -and ($d -eq 'GMP')
            $copied2 = (Test-Path "$env:DEPS_DESTDIR/usr/local/include/mpfr.h") -and ($d -eq 'MPFR')
            if (-not $installed -and -not $copied -and -not $copied2) {
              $missing += $d
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "FAILED. Missing/incomplete required deps: $($missing -join ', ')"
            exit 1
          } else {
            Write-Host "All required deps built successfully."
          }

      - name: Save deps cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: |
            deps-destdir
            deps/build
          key: woa-deps-v5-${{ hashFiles('deps/**/*.cmake', 'deps/CMakeLists.txt', 'cmake/modules/AddCMakeProject.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null
          $patterns = @(
            'deps/build/CMakeCache.txt',
            'deps/build/CMakeFiles/CMakeOutput.log',
            'deps/build/CMakeFiles/CMakeError.log',
            'deps/build/dep_*-prefix/src/dep_*-stamp/*.log',
            'deps/build/builds/*/CMakeCache.txt',
            'deps/build/builds/*/CMakeFiles/CMakeError.log',
            'deps/build/builds/*/CMakeFiles/CMakeOutput.log'
          )
          foreach ($p in $patterns) {
            Get-ChildItem -Path $p -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              $rel = (Resolve-Path -Relative $_.FullName) -replace '^\.[\\/]',''
              $dest = Join-Path 'artifacts/logs' ($rel -replace '[\\/:]','_')
              Copy-Item $_.FullName $dest -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Collected $((Get-ChildItem artifacts/logs).Count) log files."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-logs-${{ github.run_attempt }}
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload deps destdir (success only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deps-destdir-arm64
          path: deps-destdir
          retention-days: 7
          compression-level: 1
